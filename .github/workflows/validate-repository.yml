name: Validate a repository
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      context-id:
        type: string
        default: ''
      release:
        type: boolean
        default: false
    outputs:
      assets_id:
        description: Validated release files, present only for a release build
        value: ${{ jobs.build.outputs.assets_id }}
permissions:
  contents: read
jobs:
  build:
    name: Validate changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      assets_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: .release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: Kraftink-CMS/automation@master
        id: tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: 'inputs.release'
        with:
          artifact-ids: ${{ inputs.context-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-context
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Read the checked source configuration
        id: source
        env:
          TOOLS_ROOT: ${{ steps.tools.outputs.root }}
          RELEASE_ROOT: ${{ github.workspace }}/.release-source
        shell: bash
        run: node "$TOOLS_ROOT/scripts/releases/workflow.mjs" describe
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: steps.source.outputs.kind == 'extension'
        with:
          php-version: '8.5'
          extensions: zip
          coverage: none
          tools: composer:v2
      - name: Install shared extension build tooling
        if: steps.source.outputs.kind == 'extension'
        env:
          TOOLS_ROOT: ${{ steps.tools.outputs.root }}
        shell: bash
        run: |
          npm ci --prefix "$TOOLS_ROOT" --ignore-scripts --no-audit --no-fund
          composer install --working-dir="$TOOLS_ROOT/scripts/releases/php-scoper" --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Run the optional repository tests
        if: steps.source.outputs.tests == 'true'
        uses: ./.release-source/.github/actions/test
      - name: Validate the extension
        if: steps.source.outputs.kind == 'extension' && !inputs.release
        working-directory: .release-source
        env:
          TOOLS_ROOT: ${{ steps.tools.outputs.root }}
          KRAFTINK_EXTENSION_REPOSITORY: ${{ github.repository }}
          RELEASE_CONTEXT: ${{ runner.temp }}/release-context
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        shell: bash
        run: node "$TOOLS_ROOT/scripts/releases/build.mjs" check
      - name: Check extension PHP syntax
        if: steps.source.outputs.kind == 'extension'
        working-directory: .release-source
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -r -n 1 php -l
      - name: Package the validated extension
        if: steps.source.outputs.kind == 'extension' && inputs.release
        working-directory: .release-source
        env:
          TOOLS_ROOT: ${{ steps.tools.outputs.root }}
          KRAFTINK_EXTENSION_REPOSITORY: ${{ github.repository }}
          RELEASE_CONTEXT: ${{ runner.temp }}/release-context
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          node "$TOOLS_ROOT/scripts/releases/build.mjs" build "$RELEASE_CONTEXT/plan.json" "$RELEASE_ASSETS" "$RELEASE_CONTEXT/history.json"
      - name: Build the custom release files
        if: steps.source.outputs.kind == 'custom'
        uses: ./.release-source/.github/actions/build
        with:
          version: ${{ steps.source.outputs.version }}
          output-directory: ${{ runner.temp }}/release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: assets
        if: 'inputs.release'
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
